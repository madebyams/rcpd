name: CI

# Converted from the former builds.sr.ht manifest (.build.yml).
# Each sourcehut task is one step; $HOME is the workspace, as on sourcehut.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y git ca-certificates \
            cargo \
            rustc \
            libgtk-3-dev \
            libasound2-dev \
            pkg-config

      - uses: actions/checkout@v4
        with:
          path: "rcpd"
          submodules: recursive
          fetch-depth: 0

      - name: "build"
        run: |
          export HOME="$GITHUB_WORKSPACE"
          cd "$HOME"
          cd rcpd
          cargo build
